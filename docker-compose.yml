services:
  app:
    build:
      context: .
      target: runtime
    container_name: storymuse-app
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-storymuse}"
      DB_USERNAME: "${DB_USERNAME:-storymuse}"
      DB_PASSWORD: "${DB_PASSWORD:-storymuse_password}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - storymuse-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: storymuse-db
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-storymuse}"
      MYSQL_USER: "${DB_USERNAME:-storymuse}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-storymuse_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - storymuse-network
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: storymuse-adminer
    profiles:
      - tools
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - storymuse-network

volumes:
  dbdata:

networks:
  storymuse-network:
    driver: bridge
